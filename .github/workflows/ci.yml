name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Eval baseline (no key needed)
        run: node eval/run.js --baseline

  package:
    name: pack and install from tarballs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --workspace packages/cli --pack-destination "$RUNNER_TEMP/pack"
      - name: Install the tarballs in a clean project and smoke test
        run: |
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean" && npm init -y
          npm i "$RUNNER_TEMP"/pack/archivums-0*.tgz
          test ! -d node_modules/archivum-core   # one package: core is inside archivums
          export ARCHIVUM_HOME="$RUNNER_TEMP/home"
          npx --no-install archivum --version
          npx --no-install archivum remember "ci smoke" --space ci
          npx --no-install archivum recall "smoke" --space ci
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | timeout 10 npx --no-install archivum mcp --space ci | grep -q '"serverInfo"'
